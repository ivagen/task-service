[www]
; php-fpm wipes the worker environment by default, which would hide every
; variable set through docker-compose `environment:` from getenv().
clear_env = no

; Forward worker output to the master so JSON log lines reach `docker logs`.
; Without decorate_workers_output = no, fpm prefixes every line and breaks
; JSON parsing.
catch_workers_output = yes
decorate_workers_output = no

; Used by the container HEALTHCHECK.
ping.path = /ping
ping.response = pong

; The application writes its own structured access log; fpm's would otherwise
; add a non-JSON line per healthcheck ping.
access.log = /dev/null
