server_tokens off;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # API-only service: every request goes to the single front controller, so
    # nginx never needs the application source on its own filesystem.
    location / {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/web;
        fastcgi_read_timeout 30s;
    }
}
