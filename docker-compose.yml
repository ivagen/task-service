services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./www:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - task-service
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-task_service}
      - DB_USER=${DB_USER:-task_service}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://auth_service_nginx:8000

  nginx:
    image: nginx:alpine
    ports:
      - "8002:80"
    volumes:
      - ./www:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - task-service

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-task_service}
      MYSQL_USER: ${DB_USER:-task_service}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task-service

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - task-service

volumes:
  mysql_data:

networks:
  task-service:
    driver: bridge