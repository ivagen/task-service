# Development stack. Every value comes from the root .env (see .env.example).
# For production see docker-compose.prod.yml.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./www:/var/www
      # OpenAPI contract tests resolve the repository-level specification.
      - ./docs:/var/docs:ro
      # Keep the vendor/ and runtime/ built inside the image from being hidden
      # by the bind mount above.
      - vendor:/var/www/vendor
      - runtime:/var/www/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - task-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-task_service}
      DB_USER: ${DB_USER:-task_service}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8000}
      AUTH_USER_PATH: ${AUTH_USER_PATH:-api/v1/user}
      AUTH_TIMEOUT: ${AUTH_TIMEOUT:-3}
      AUTH_CONNECT_TIMEOUT: ${AUTH_CONNECT_TIMEOUT:-2}
      AUTH_CACHE_TTL: ${AUTH_CACHE_TTL:-60}
      AUTH_RETRIES: ${AUTH_RETRIES:-1}
      AUTH_RETRY_DELAY_MS: ${AUTH_RETRY_DELAY_MS:-100}
      AUTH_TOTAL_TIMEOUT: ${AUTH_TOTAL_TIMEOUT:-5}
      RATE_LIMIT: ${RATE_LIMIT:-60}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      YII_DEBUG: ${YII_DEBUG:-true}
      YII_ENV: ${YII_ENV:-dev}

  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "${APP_HOST_PORT:-8002}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - task-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_DATABASE: ${DB_NAME:-task_service}
      MYSQL_USER: ${DB_USER:-task_service}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task-service
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - task-service
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  vendor:
  runtime:

networks:
  task-service:
    driver: bridge
